version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - gocritic
    - misspell
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - revive

  exclusions:
    generated: strict
    rules:
      # envsync is a CLI tool — file permissions are intentional
      - path: 'ci/envsync/'
        linters:
          - gosec
      # Error code constants are not credentials
      - linters:
          - gosec
        text: "G101"

formatters:
  enable:
    - gofumpt
    - goimports
